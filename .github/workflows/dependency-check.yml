# The dependency reader: a lockfile change is judged before it merges, as a required
# status, so no package reaches the sandbox on an agent's say-so.
#
#   1. GitHub's dependency review: known vulnerabilities and disallowed licences in
#      what the PR adds (needs the repository's dependency graph, on by default for
#      public repos).
#   2. Registry signatures and provenance attestations verified for every installed
#      package (`npm audit signatures`).
#   3. The repo's own reader, scripts/lockfile-check.mjs: every package added or
#      changed, refused on install scripts, a version under seven days old, a
#      publisher change or a tarball off the registry; the report is posted as a
#      PR comment. Exceptions are reviewed lines in .github/dependency-allow.json.
#
# Runs on every PR so it can be a required status in the main ruleset: a workflow
# skipped by a path filter leaves a required status "expected" forever and blocks the
# merge. The first step decides whether a dependency file changed; when none did the
# job ends green in seconds and posts nothing.
name: dependency-check
on:
  pull_request:
permissions:
  contents: read
  pull-requests: write
jobs:
  dependency-check:
    runs-on: ubuntu-latest
    steps:
      - name: did a dependency file change
        id: changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=$(gh api --paginate "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" --jq '.[].filename')
          if grep -qxE 'package\.json|package-lock\.json|\.github/dependency-allow\.json|scripts/lockfile-check\.mjs' <<<"$files"; then
            echo "deps=true" >> "$GITHUB_OUTPUT"; echo "dependency files changed; checking"
          else
            echo "deps=false" >> "$GITHUB_OUTPUT"; echo "no dependency file changed; nothing to check"
          fi
      - if: steps.changed.outputs.deps == 'true'
        uses: actions/checkout@v4
      - if: steps.changed.outputs.deps == 'true'
        name: GitHub dependency review (vulnerabilities, licences)
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: low
      - if: steps.changed.outputs.deps == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - if: steps.changed.outputs.deps == 'true'
        run: npm ci --ignore-scripts
      - if: steps.changed.outputs.deps == 'true'
        name: registry signatures and provenance
        run: npm audit signatures
      - if: steps.changed.outputs.deps == 'true'
        name: the base lockfile
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/contents/package-lock.json?ref=${{ github.base_ref }}" \
            -H "Accept: application/vnd.github.raw" > /tmp/base-lock.json \
            || echo '{}' > /tmp/base-lock.json   # a base with no lockfile yet: every package counts as added (Izzy, Gemini's catch)
      - if: steps.changed.outputs.deps == 'true'
        name: the repo's lockfile reader
        id: reader
        run: |
          set +e
          node scripts/lockfile-check.mjs /tmp/base-lock.json package-lock.json > /tmp/report.md
          echo "status=$?" >> "$GITHUB_OUTPUT"
          cat /tmp/report.md
      - if: steps.changed.outputs.deps == 'true'
        name: post the report on the PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --body-file /tmp/report.md
      - if: steps.changed.outputs.deps == 'true'
        name: fail on a refusal
        run: test "${{ steps.reader.outputs.status }}" = "0"
